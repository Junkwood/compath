plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    //페이지 네이션
    implementation 'com.github.pagehelper:pagehelper-spring-boot-starter:2.1.0'

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Oracle JDBC (Java 21)
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-devtools'
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 1. Spring Security core 및 web (인증 객체 및 핸들러 인터페이스용)
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 2. Servlet API (HttpServletRequest, HttpServletResponse 사용을 위해 필수)
    // Spring Boot 3.x 이상은 별도 추가 없이 starter-web에 포함되어 있으나,
    // 만약 컴파일 에러가 난다면 아래를 확인하세요.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 테스트 환경에서도 시큐리티 기능을 쓰려면 추가
    testImplementation 'org.springframework.security:spring-security-test'
    // JWT 라이브러리 (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    //hibernate
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.5.2.Final'
}



tasks.named('test') {
    useJUnitPlatform()
}