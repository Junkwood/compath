plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // MyBatis
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Oracle JDBC (Java 21)
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-devtools'
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
// 1. Spring Security core 및 web (인증 객체 및 핸들러 인터페이스용)
    //implementation 'org.springframework.boot:spring-boot-starter-security'

    // 2. Servlet API (HttpServletRequest, HttpServletResponse 사용을 위해 필수)
    // Spring Boot 3.x 이상은 별도 추가 없이 starter-web에 포함되어 있으나,
    // 만약 컴파일 에러가 난다면 아래를 확인하세요.
    //implementation 'org.springframework.boot:spring-boot-starter-web'

    // 3. Lombok ( @Slf4j 어노테이션 사용을 위해 필수 )
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트 환경에서도 시큐리티 기능을 쓰려면 추가
    //testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}